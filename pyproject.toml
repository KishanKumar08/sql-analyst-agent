[project]
name = "sql-analyst-agent"
version = "0.1.0"
description = "A SQL analyst agent with a hand-written harness"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.60",
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[project.scripts]
agent = "agent.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]
